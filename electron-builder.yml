appId: dev.deployableknowledge.app
productName: Deployable Knowledge
copyright: Copyright (c) 2025 The Deployable Knowledge contributors

directories:
  buildResources: electron/build
  output: release

asar: false
npmRebuild: false
publish: null

# Keep every pattern here: a platform-level `files` list replaces this one instead of extending it.
files:
  - build/**
  - drizzle/**
  - electron/*.{cjs,ts}
  - LICENSE
  - THIRD-PARTY-NOTICES.md
  # transformers.js inlines the ONNX Runtime Web code it needs and runs models on onnxruntime-node.
  - '!node_modules/onnxruntime-web/**'
  # onnxruntime-node bundles every platform, in folders named win32, linux and darwin. `${os}` is
  # the target (win, linux), so the prefix match keeps only its folder. Every model runs on the
  # CPU execution provider.
  - '!node_modules/onnxruntime-node/bin/napi-v6/!(${os}*)/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/${os}*/!(${arch})/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime_providers_{cuda,tensorrt}.so'
  # llama.cpp ships without CUDA: its prebuilt binaries need a CUDA Toolkit install to load, and
  # Vulkan covers NVIDIA GPUs without one. The ARM packages install on x64 hosts too, and every
  # target below is x64.
  - '!node_modules/@node-llama-cpp/*-cuda{,-ext}/**'
  - '!node_modules/@node-llama-cpp/*-{arm64,armv7l}/**'

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
  artifactName: ${productName}-${version}-windows-x64-setup.${ext}

linux:
  target:
    - target: deb
      arch:
        - x64
  category: Utility
  maintainer: The Deployable Knowledge contributors

deb:
  artifactName: ${productName}-${version}-ubuntu-amd64.${ext}
